<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Espaço Priscila Oliveira | Links Úteis</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-links.css">
</head>
<body>

  <!-- Alternador de Tema Refinado -->
  <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
    <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </button>

  <div class="container">
    <header class="profile-header">
      <div class="logo-wrapper">
        <img src="imagens/logo.png" alt="Logo Espaço Priscila Oliveira" class="avatar-logo">
      </div>
      <h1>Espaço <span>Priscila Oliveira</span></h1>
      <p>Realçamos sua beleza natural e elevamos sua autoestima.</p>
    </header>

    <!-- Botões Limpos e Profissionais -->
    <nav class="links-list">
      <a href="https://espacopriscilaoliveira.com/#servicos" class="link-item">
        <span class="link-text">Agendamentos</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://wa.me/5521982490919" class="link-item" target="_blank" rel="noopener noreferrer">
        <span class="link-text">WhatsApp</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://instagram.com/SEU_USER_AQUI" class="link-item" target="_blank" rel="noopener noreferrer">
        <span class="link-text">Instagram</span>
        <span class="link-arrow">→</span>
      </a>
      <a href="https://maps.app.goo.gl/mud9bvrWzaV2AaqMA" class="link-item" target="_blank" rel="noopener noreferrer">
        <span class="link-text">Localização</span>
        <span class="link-arrow">→</span>
      </a>
    </nav>

    <footer class="links-footer">
      <p>Estética de Alto Padrão</p>
    </footer>
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
