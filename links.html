<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Espaço Priscila Oliveira | Links Úteis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style-links.css">
</head>

<body>
  <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
    <svg class="sun-icon" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"></circle>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
    </svg>

    <svg class="moon-icon" viewBox="0 0 24 24">
      <path d="M21 14.2A8.5 8.5 0 0 1 9.8 3a7 7 0 1 0 11.2 11.2z"></path>
    </svg>
  </button>

  <main class="container">
    <header class="profile-header">
      <div class="logo-frame">
        <img src="imagens/logo.png" alt="Logo Espaço Priscila Oliveira" class="avatar-logo">
      </div>

      <p class="eyebrow">Beleza • Estética • Autocuidado</p>

      <h1>Espaço <span>Priscila Oliveira</span></h1>

      <p class="description">
        Realçamos sua beleza natural com cuidado, elegância e atendimento personalizado.
      </p>
    </header>

    <nav class="links-list" aria-label="Links principais">
      <a href="https://espacopriscilaoliveira.com/#servicos" class="link-item">
        <svg viewBox="0 0 24 24">
          <path d="M8 2v4M16 2v4M3 9h18M5 5h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"></path>
        </svg>
        <span>Agendar Horário</span>
      </a>

      <a href="https://wa.me/5521982490919" class="link-item" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24">
          <path d="M21 11.5a8.5 8.5 0 0 1-12.8 7.3L3 20l1.3-5A8.5 8.5 0 1 1 21 11.5z"></path>
          <path d="M9.5 8.5c.3 2.1 1.9 4 4 4.8l1.5-1.1 2 1.3c-.4 1.7-1.5 2.5-3.2 2.2-3.5-.7-6.1-3.5-6.7-6.6-.3-1.6.6-2.8 2.2-3.1l1.2 2.1-1 1.4z"></path>
        </svg>
        <span>Falar no WhatsApp</span>
      </a>

      <a href="https://instagram.com/SEU_USER_AQUI" class="link-item" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
        <span>Instagram Oficial</span>
      </a>

      <a href="https://maps.app.goo.gl/mud9bvrWzaV2AaqMA" class="link-item" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24">
          <path d="M12 21s7-5.3 7-12a7 7 0 1 0-14 0c0 6.7 7 12 7 12z"></path>
          <circle cx="12" cy="9" r="2.5"></circle>
        </svg>
        <span>Localização</span>
      </a>
    </nav>

    <footer class="links-footer">
      <p>© 2026 — Espaço Priscila Oliveira</p>
    </footer>
  </main>

  <script>
    const themeToggle = document.getElementById("theme-toggle");
    const body = document.body;

    const savedTheme = localStorage.getItem("theme");

    if (savedTheme === "dark") {
      body.classList.add("dark-mode");
    }

    themeToggle.addEventListener("click", () => {
      body.classList.toggle("dark-mode");

      localStorage.setItem(
        "theme",
        body.classList.contains("dark-mode") ? "dark" : "light"
      );
    });
  </script>
</body>
</html>
