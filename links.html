<!DOCTYPE html>

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Espaço Priscila Oliveira | Links Úteis" />
  <meta name="twitter:description" content="Agendamentos, WhatsApp, Instagram e localização do Espaço Priscila Oliveira." />
  <meta name="twitter:image" content="https://espacopriscilaoliveira.com/imagens/logo.webp" />
  <link rel="icon" type="image/webp" href="imagens/favicon.webp" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style-links.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- Cenário de Fundo: Vidro Jateado Cênico -->
  <div class="glass-bg-container">
    <div class="glow-ambient"></div>
    <div class="glow-sphere glow-1"></div>
    <div class="glow-sphere glow-2"></div>
    <div class="glow-sphere glow-3"></div>
  </div>

  <!-- Controle de Tema Minimalista -->
  <button id="theme-toggle" class="theme-btn" aria-label="Alternar tema">
    <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4.5"></circle>
      <path d="M12 2.5v2M12 19.5v2M4.8 4.8l1.4 1.4M17.8 17.8l1.4 1.4M2.5 12h2M19.5 12h2M4.8 19.2l1.4-1.4M17.8 6.2l1.4-1.4"></path>
    </svg>
    <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.5 14.3A8.3 8.3 0 0 1 9.7 3.5a7 7 0 1 0 10.8 10.8z"></path>
    </svg>
  </button>

  <div class="container">
    <header class="profile-header">
      <div class="logo-wrapper">
        <img src="imagens/logo.webp" alt="Logo Espaço Priscila Oliveira" class="avatar-logo">
      </div>
      <h1>Espaço <span>Priscila Oliveira</span></h1>
      <p>Realçamos sua beleza natural e elevamos sua autoestima.</p>
    </header>

    <nav class="links-list">
      <a href="https://espacopriscilaoliveira.com/#servicos" class="link-item">
        <div class="link-content">
          <span class="link-text">Agendamentos</span>
          <span class="link-arrow">↓</span>
        </div>
      </a>
      <a href="https://wa.me/5521982490919" class="link-item" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <span class="link-text">WhatsApp</span>
          <span class="link-arrow">↓</span>
        </div>
      </a>
      <a href="https://instagram.com/prioliveira_naildesign" class="link-item" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <span class="link-text">Instagram</span>
          <span class="link-arrow">↓</span>
        </div>
      </a>
      <a href="https://maps.app.goo.gl/mud9bvrWzaV2AaqMA" class="link-item" target="_blank" rel="noopener noreferrer">
        <div class="link-content">
          <span class="link-text">Localização</span>
          <span class="link-arrow">↓</span>
        </div>
      </a>
    </nav>

    <footer class="links-footer">
      <p>Estética de Alto Padrão</p>
    </footer>
  </div>

  <script>
    const themeToggle = document.getElementById('theme-toggle');
    const body = document.body;

    if (localStorage.getItem('theme') === 'dark') {
      body.classList.add('dark-mode');
    }

    themeToggle.addEventListener('click', () => {
      body.classList.toggle('dark-mode');
      if (body.classList.contains('dark-mode')) {
        localStorage.setItem('theme', 'dark');
      } else {
        localStorage.setItem('theme', 'light');
      }
    });
  </script>
</body>
</html>
